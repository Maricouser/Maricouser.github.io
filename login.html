<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录注册</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 80px auto; padding: 0 20px; }
    h2 { text-align: center; color: #333; }
    input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
    button { width: 48%; padding: 12px; margin: 8px 1%; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; background: #3ecf8e; color: white; }
    #msg { margin-top: 16px; padding: 12px; border-radius: 6px; display: none; }
    .success { background: #d4edda; color: #155724; display: block !important; }
    .error { background: #f8d7da; color: #721c24; display: block !important; }
  </style>
</head>
<body>
<h2>注册 / 登录</h2>
<div>
  <input type="email" id="email" placeholder="邮箱">
  <input type="password" id="pwd" placeholder="密码（至少6位）">
  <button onclick="register()">注册</button>
  <button onclick="login()">登录</button>
</div>
<div id="msg"></div>

<!-- 换用unpkg CDN -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
  const supabaseUrl = "https://jakwpsfwekrtotxqhamp.supabase.co";
  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impha3dwc2Z3ZWtydG90eHFoYW1wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NjE4NTgsImV4cCI6MjEwNDUzNzg1OH0.wwoo35wOFAM2V8-JOHRUADIDY07YV6VG-EAsnb_L4Do";

  // 检查SDK是否加载成功
  if (!window.supabase) {
    document.getElementById('msg').textContent = 'Supabase SDK加载失败，请检查网络或刷新页面';
    document.getElementById('msg').className = 'error';
  }

  var supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
  console.log('Supabase客户端：', supabase);
  console.log('auth模块：', supabase.auth);

  function showMsg(text, type) {
    const msg = document.getElementById('msg');
    msg.textContent = text;
    msg.className = type;
  }

  async function register() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('pwd').value;
    if (!email || !password) { showMsg('请输入邮箱和密码', 'error'); return; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { showMsg('邮箱格式不正确，必须包含@，如 name@example.com', 'error'); return; }
    if (password.length < 6) { showMsg('密码至少6位', 'error'); return; }
    showMsg('注册中...', 'success');
    try {
      const { data, error } = await supabase.auth.signUp({ email, password });
      if (error) {
        showMsg('注册失败：' + error.message, 'error');
      } else {
        showMsg('注册成功，正在自动登录...', 'success');
        // 自动登录并跳转主页（邮箱验证已关闭时可直接登录）
        const { data: d2, error: e2 } = await supabase.auth.signInWithPassword({ email, password });
        if (e2) { showMsg('注册成功，请点击「登录」：' + e2.message, 'error'); }
        else if (d2.session) { window.location.href = "./index.html"; }
      }
    } catch (e) {
      showMsg('注册异常：' + e.message, 'error');
      console.error(e);
    }
  }

  async function login() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('pwd').value;
    if (!email || !password) { showMsg('请输入邮箱和密码', 'error'); return; }
    showMsg('登录中...', 'success');
    try {
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) showMsg('登录失败：' + error.message, 'error');
      else if (data.session) {
        showMsg('登录成功，正在跳转...', 'success');
        setTimeout(() => { window.location.href = "./index.html"; }, 500);
      }
    } catch (e) {
      showMsg('登录异常：' + e.message, 'error');
      console.error(e);
    }
  }
</script>
</body>
</html>
